<!doctype html>
<html lang=en>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Create Quotation – Technopaths Quota</title>
<link href=https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css rel=stylesheet>
<link rel=stylesheet href=https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel=stylesheet>
<link rel=stylesheet href=style.css>
</head>
<body data-page=create>
<div id=tqNav></div>
<div class=tq-main>
<h2><i class="bi bi-file-earmark-plus me-2"></i>Create New Quotation</h2>
<hr>
<form id=quoteForm novalidate>
<div class="row g-3 mb-4">
<div class=col-md-6>
<label class=form-label>Quotation Number</label>
<input class=form-control id=quoteNumber readonly>
</div>
<div class=col-md-3>
<label class=form-label>Date Created</label>
<input type=date class=form-control id=dateCreated readonly>
</div>
<div class=col-md-3>
<label class=form-label>Date Expires</label>
<input type=date class=form-control id=dateExpires>
</div>
</div>
<div class="row g-3 mb-4">
<div class=col-md-6>
<label class=form-label>Service Offered</label>
<select class=form-select id=service>
<option value="">Select a service</option>
<option>Software Development</option>
<option>Web Development</option>
<option>Database Design</option>
<option>ICT Recommendation</option>
<option>ICT Research</option>
<option>Innovation Consulting</option>
</select>
</div>
<div class=col-md-6>
<label class=form-label>Client Type</label>
<select class=form-select id=clientType>
<option value="">Select type</option>
<option>Individual</option>
<option>Company</option>
<option>Government</option>
<option>NGO</option>
<option>Educational Institution</option>
</select>
</div>
</div>
<h5 class=mt-3><i class="bi bi-person-lines-fill me-2"></i>Client Information</h5>
<div class="row g-3 mb-4">
<div class=col-md-4>
<label class=form-label>Client Name <span class=text-danger>*</span></label>
<input class=form-control id=clientName required>
</div>
<div class=col-md-4>
<label class=form-label>Client Email</label>
<input type=email class=form-control id=clientEmail>
</div>
<div class=col-md-4>
<label class=form-label>Client Phone</label>
<input class=form-control id=clientPhone>
</div>
<div class=col-md-6>
<label class=form-label>Address</label>
<textarea class=form-control id=clientAddress rows=2></textarea>
</div>
<div class=col-md-6>
<label class=form-label>Company/Organization (optional)</label>
<input class=form-control id=clientCompany>
</div>
</div>
<h5><i class="bi bi-list-check me-2"></i>Quotation Items</h5>
<div id=itemsContainer>
<div class="row g-2 mb-2 item-row">
<div class=col-md-5><input class="form-control item-desc" placeholder=Description></div>
<div class=col-md-2><input type=number class="form-control item-qty" placeholder=Qty value=1 min=1></div>
<div class=col-md-2><input type=number class="form-control item-price" placeholder="Unit Price" step=0.01></div>
<div class=col-md-2><input class="form-control item-total" placeholder=Total readonly></div>
<div class=col-md-1><button type=button class="btn btn-outline-danger remove-item"><i class="bi bi-trash"></i></button></div>
</div>
</div>
<button type=button class="btn btn-outline-secondary btn-sm mb-3" id=addItemBtn><i class="bi bi-plus-circle"></i> Add Item</button>
<div class="row g-3 mb-4 bg-light p-3 rounded">
<div class=col-md-3><label class=fw-bold>Subtotal</label><input class=form-control id=subtotal readonly value=0.00></div>
<div class=col-md-3><label class=fw-bold>Tax (15% VAT)</label><input class=form-control id=tax readonly value=0.00></div>
<div class=col-md-3><label class=fw-bold>Grand Total</label><input class=form-control id=grandTotal readonly value=0.00></div>
<div class=col-md-3>
<label class=form-label>Additional Notes</label>
<textarea class=form-control id=notes rows=1></textarea>
</div>
</div>
<div class="d-flex flex-wrap gap-2 mb-5">
<button type=submit class="btn btn-accent" id=saveBtn>
<span id=saveBtnText><i class="bi bi-save me-1"></i>Save Quotation</span>
<span id=saveSpinner class="spinner-border spinner-border-sm d-none" role=status></span>
</button>
<button type=button class="btn btn-outline-secondary" id=resetBtn><i class="bi bi-arrow-counterclockwise me-1"></i>Reset Form</button>
<button type=button class="btn btn-outline-info" id=previewBtn><i class="bi bi-eye me-1"></i>Preview</button>
</div>
</form>
</div>
<div class="modal fade" id=previewModal tabindex=-1>
<div class="modal-dialog modal-lg">
<div class=modal-content>
<div class=modal-header><h5 class=modal-title>Quotation Preview</h5><button type=button class=btn-close data-bs-dismiss=modal></button></div>
<div class=modal-body id=previewContent></div>
</div>
</div>
</div>
<div class="modal fade" id=successModal tabindex=-1>
<div class=modal-dialog>
<div class=modal-content>
<div class="modal-header bg-success text-white"><h5 class=modal-title><i class="bi bi-check-circle me-2"></i>Success!</h5><button type=button class="btn-close btn-close-white" data-bs-dismiss=modal></button></div>
<div class=modal-body id=successMessage>Quotation created successfully!</div>
<div class=modal-footer>
<button type=button class="btn btn-outline-secondary" id=createAnotherBtn><i class="bi bi-plus-circle me-1"></i>Create Another</button>
<button type=button class="btn btn-accent" id=viewQuoteBtn><i class="bi bi-eye me-1"></i>View Quotation</button>
</div>
</div>
</div>
</div>
<script src=https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js></script>
<script src=config.js></script>
<script src=script.js></script>
<script>document.addEventListener("DOMContentLoaded",(function(){checkAuth(),initCreateQuote()}))</script>
</body>
</html>
