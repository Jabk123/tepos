<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technopaths Quota – Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="tq-login-wrap">
        <div class="login-card" id="loginCard">
            <div class="login-brand">
                <span class="brand-icon"><i class="bi bi-diagram-3"></i></span>
                <h1>Technopaths <small>Quota</small></h1>
                <p>Sign in to manage your quotations</p>
            </div>

            <div id="loginError" class="alert alert-danger d-none" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="loginErrorMessage">Invalid credentials</span>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="mb-3">
                    <label for="username" class="form-label"><i class="bi bi-person me-1"></i> Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter your username" required />
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label"><i class="bi bi-lock me-1"></i> Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="loginBtnText">Sign In</span>
                    <span id="loginSpinner" class="spinner-login d-none"></span>
                </button>
            </form>

            <div class="login-footer">
                &copy; 2026 <strong>Technopaths Entity</strong> &mdash; All rights reserved.
            </div>
        </div>
    </div>

     <!-- Load config first -->
    <script src="config.example.js"></script>
    <!-- Load main script with all functionality -->
    <script src="script.js"></script>
</body>
</html>
