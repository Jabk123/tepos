<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technopaths Quota – Login</title>
    <!-- Bootstrap 5 + Icons + Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ── GLOBAL RESET & VARIABLES ── */
        :root {
            --primary: #2C3E50;
            --primary-light: #3a506b;
            --accent: #3498DB;
            --accent-light: #5faee3;
            --success: #27AE60;
            --bg-light: #f4f6f9;
            --card-shadow: 0 12px 40px rgba(44, 62, 80, 0.12);
            --radius: 16px;
            --transition: 0.25s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        /* ── LOGIN CARD ── */
        .login-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 48px 40px 40px;
            max-width: 440px;
            width: 100%;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-brand h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .login-brand h1 small {
            font-weight: 400;
            color: var(--accent);
            font-size: 18px;
        }
        .login-brand p {
            color: #6c7a8a;
            font-size: 14px;
            margin-top: 4px;
        }
        .login-brand .brand-icon {
            font-size: 48px;
            color: var(--accent);
            display: block;
            margin-bottom: 8px;
        }
        .form-label {
            font-weight: 600;
            font-size: 14px;
            color: var(--primary);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            font-size: 15px;
            transition: var(--transition);
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.15);
        }
        .btn-login {
            background: var(--primary);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            width: 100%;
            transition: var(--transition);
            position: relative;
        }
        .btn-login:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(44, 62, 80, 0.25);
        }
        .btn-login:disabled {
            opacity: 0.7;
            transform: none;
        }
        .alert-error {
            border-radius: 10px;
            font-size: 14px;
            padding: 12px 16px;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #8a9aa8;
        }
        .login-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .spinner-login {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 20px 28px;
            }
            .login-brand h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card" id="loginCard">
        <div class="login-brand">
            <span class="brand-icon"><i class="bi bi-box-seam"></i></span>
            <h1>Technopaths <small>Quota</small></h1>
            <p>Sign in to manage your quotations</p>
        </div>

        <!-- Error alert -->
        <div id="loginError" class="alert alert-danger alert-error d-none" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span id="loginErrorMessage">Invalid credentials</span>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="mb-3">
                <label for="username" class="form-label"><i class="bi bi-person me-1"></i> Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter your username" value="admin" required />
            </div>
            <div class="mb-4">
                <label for="password" class="form-label"><i class="bi bi-lock me-1"></i> Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" value="Technopaths2026" required />
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginBtnText">Sign In</span>
                <span id="loginSpinner" class="spinner-login d-none"></span>
            </button>
        </form>

        <div class="login-footer">
            &copy; 2026 <strong>Technopaths Entity</strong> &mdash; All rights reserved.
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        // ──────────────────────────────────────────────
        // LOGIN LOGIC
        // ──────────────────────────────────────────────
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginSpinner');
            const errorAlert = document.getElementById('loginError');
            const errorMsg = document.getElementById('loginErrorMessage');

            // Hardcoded credentials
            const VALID_USER = 'admin';
            const VALID_PASS = 'Technopaths2026';

            // If already logged in, redirect to dashboard
            if (sessionStorage.getItem('tq_logged_in') === 'true') {
                window.location.href = 'dashboard.html';
                return;
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                // Validate
                if (!username || !password) {
                    showError('Please enter both username and password.');
                    return;
                }

                // Show loading
                setLoading(true);

                // Simulate network delay (or real check)
                setTimeout(function() {
                    if (username === VALID_USER && password === VALID_PASS) {
                        // Success
                        sessionStorage.setItem('tq_logged_in', 'true');
                        sessionStorage.setItem('tq_username', username);
                        sessionStorage.setItem('tq_full_name', 'Administrator');
                        window.location.href = 'dashboard.html';
                    } else {
                        showError('Invalid username or password. Please try again.');
                        setLoading(false);
                    }
                }, 600);
            });

            function showError(msg) {
                errorMsg.textContent = msg;
                errorAlert.classList.remove('d-none');
                // Auto-hide after 4s
                clearTimeout(window._loginErrorTimer);
                window._loginErrorTimer = setTimeout(function() {
                    errorAlert.classList.add('d-none');
                }, 4000);
            }

            function setLoading(loading) {
                if (loading) {
                    loginBtn.disabled = true;
                    btnText.textContent = 'Signing in…';
                    spinner.classList.remove('d-none');
                } else {
                    loginBtn.disabled = false;
                    btnText.textContent = 'Sign In';
                    spinner.classList.add('d-none');
                }
            }

            // Clear error on input
            usernameInput.addEventListener('input', function() {
                errorAlert.classList.add('d-none');
            });
            passwordInput.addEventListener('input', function() {
                errorAlert.classList.add('d-none');
            });

        })();
    </script>

</body>
</html>
