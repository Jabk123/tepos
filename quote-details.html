<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Details – Technopaths Quota</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- html2pdf for PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="bi bi-box-seam me-2"></i>Technopaths <span class="fw-light">Quota</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="create-quote.html"><i class="bi bi-plus-circle"></i> New Quote</a></li>
          <li class="nav-item"><a class="nav-link" href="view-quotes.html"><i class="bi bi-list-ul"></i> All Quotes</a></li>
          <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4" id="detailsContainer">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2><i class="bi bi-file-text me-2"></i>Quotation Details</h2>
      <div>
        <button class="btn btn-outline-secondary" id="backBtn"><i class="bi bi-arrow-left me-1"></i>Back</button>
        <button class="btn btn-outline-primary" id="printBtn"><i class="bi bi-printer me-1"></i>Print</button>
        <button class="btn btn-accent" id="pdfBtn"><i class="bi bi-file-pdf me-1"></i>Download PDF</button>
      </div>
    </div>
    <div id="quoteDisplay" class="p-4 border rounded bg-white">
      <!-- Will be filled by JavaScript -->
      <div class="text-center py-5 text-muted">Loading quotation…</div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      checkAuth();
      initQuoteDetails();
    });
  </script>
</body>
</html>
