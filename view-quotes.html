<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Quotations – Technopaths Quota</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="view">

  <div id="tqNav"></div>

  <div class="tq-main">
    <h2><i class="bi bi-table me-2"></i>All Quotations</h2>
    <hr />

    <!-- Search & Filters -->
    <div class="row g-2 mb-3">
      <div class="col-md-4"><input type="text" class="form-control" id="searchInput" placeholder="Search by client or quote #" /></div>
      <div class="col-md-3"><select class="form-select" id="statusFilter"><option value="">All Status</option><option>Active</option><option>Expired</option><option>Draft</option></select></div>
      <div class="col-md-3"><button class="btn btn-outline-primary" id="exportCsvBtn"><i class="bi bi-download me-1"></i>Export CSV</button></div>
      <div class="col-md-2"><button class="btn btn-outline-secondary" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i></button></div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="quotesTable">
            <thead>
              <tr>
                <th>Quote #</th>
                <th>Client</th>
                <th>Service</th>
                <th>Date</th>
                <th>Expires</th>
                <th>Total</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="quotesTableBody">
              <tr><td colspan="8" class="text-center py-4 text-muted">Loading quotations…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <nav class="mt-3" id="paginationNav">
      <ul class="pagination justify-content-center" id="paginationList"></ul>
    </nav>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Confirm Delete</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">Are you sure you want to delete this quotation?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      checkAuth();
      initViewQuotes();
    });
  </script>
</body>
</html>
